name: Build and publish Docker image

on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - docker/**
      - .github/workflows/docker-publish.yml
  schedule:
    - cron: "17 3 * * 0"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve latest Feynman version
        id: feynman
        shell: bash
        run: echo "version=$(npm view @advaitpaliwal/feynman version)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/unraid-feynman
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.feynman.outputs.version }}
            type=sha,prefix=sha-
          labels: |
            org.opencontainers.image.title=Feynman for Unraid
            org.opencontainers.image.description=Unofficial Docker packaging of Feynman for Unraid
            org.opencontainers.image.version=${{ steps.feynman.outputs.version }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: |
            FEYNMAN_VERSION=${{ steps.feynman.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
