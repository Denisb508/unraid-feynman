<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Feynman for Unraid">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#072f24"/>
      <stop offset="0.55" stop-color="#041d18"/>
      <stop offset="1" stop-color="#020b0a"/>
    </linearGradient>
    <linearGradient id="mint" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d6ffe2"/>
      <stop offset="0.42" stop-color="#7bf1a8"/>
      <stop offset="1" stop-color="#16c784"/>
    </linearGradient>
    <radialGradient id="core" cx="40%" cy="35%" r="65%">
      <stop offset="0" stop-color="#effff4"/>
      <stop offset="0.45" stop-color="#72f0aa"/>
      <stop offset="1" stop-color="#00b877"/>
    </radialGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect x="10" y="10" width="492" height="492" rx="104" fill="url(#bg)" stroke="#3ddc97" stroke-width="3" filter="url(#soft)"/>

  <g opacity="0.22" fill="none" stroke="#7ce7ad" stroke-width="3">
    <path d="M58 188 L92 156 L126 188 L126 228 L92 250 L58 228 Z"/>
    <circle cx="58" cy="188" r="5" fill="#7ce7ad"/>
    <circle cx="92" cy="156" r="5" fill="#7ce7ad"/>
    <circle cx="126" cy="188" r="5" fill="#7ce7ad"/>
    <path d="M374 112 L410 148 M410 112 L374 148 M410 148 L450 188"/>
    <path d="M402 160 q12 -18 24 0 t24 0"/>
  </g>

  <g opacity="0.22" fill="#b7f6cf" font-family="Georgia,serif" font-style="italic">
    <text x="54" y="118" font-size="34">E = mc²</text>
    <text x="375" y="255" font-size="32">∫ L dt</text>
  </g>

  <g transform="translate(256 218)" fill="none" stroke="url(#mint)" stroke-width="18" stroke-linecap="round" filter="url(#glow)">
    <ellipse rx="146" ry="56" transform="rotate(28)"/>
    <ellipse rx="146" ry="56" transform="rotate(-28)"/>
    <ellipse rx="146" ry="56" transform="rotate(90)"/>
  </g>
  <circle cx="256" cy="218" r="27" fill="url(#core)" filter="url(#glow)"/>

  <text x="256" y="382" text-anchor="middle" fill="#f4fff7" font-family="Arial,Helvetica,sans-serif" font-size="68" font-weight="800" letter-spacing="-2">Feynman</text>
  <text x="256" y="420" text-anchor="middle" fill="#45e49a" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="600" letter-spacing="7">OPEN SCIENCE</text>
  <rect x="130" y="442" width="252" height="3" rx="1.5" fill="#2ed88b" opacity="0.75"/>
  <text x="256" y="473" text-anchor="middle" fill="#9cc7b1" font-family="Arial,Helvetica,sans-serif" font-size="14" letter-spacing="3">RESEARCH • NOTEBOOKS • AI</text>
</svg>
